# Include once in nginx's http context (e.g. /etc/nginx/sites-enabled/mu56).
upstream mu56_django { server 127.0.0.1:8000; }
upstream mu56_next { server 127.0.0.1:3000; }
log_format mu56_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=mu56_leads:10m rate=10r/m;

server {
    listen 80;
    server_name mu56.ru;
    if ($host != mu56.ru) { return 444; }
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://mu56.ru$request_uri; }
}

server {
    listen 443 ssl;
    server_name mu56.ru;
    if ($host != mu56.ru) { return 444; }
    ssl_certificate /etc/letsencrypt/live/mu56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mu56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m; # Photos uploaded through the admin.
    access_log /var/log/nginx/mu56-access.log mu56_safe;
    error_log /var/log/nginx/mu56-error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_redirect off;

    location = /health/ { return 404; }
    location = /api/v1/leads/ {
        client_max_body_size 64k;
        limit_req zone=mu56_leads burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://mu56_django;
    }
    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://mu56_django;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ { proxy_pass http://mu56_django; }
    location /static/ {
        alias /srv/mu56/shared/static/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location /uploads/ {
        alias /srv/mu56/shared/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_buffering off; # Keep Next.js streaming responses intact.
        proxy_pass http://mu56_next;
    }
}

# Next.js server rendering and image optimization use this loopback-only entry.
# It cannot submit leads or access the admin; clients use the HTTPS server above.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;
    location /api/v1/ {
        limit_except GET { deny all; }
        proxy_set_header Host mu56.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header Connection "";
        proxy_pass http://mu56_django;
    }
    location /uploads/ {
        alias /srv/mu56/shared/media/;
        autoindex off;
    }
    location / { return 404; }
}
