name: mu56-local
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}
services:
  database:
    <<: *runtime
    image: postgres:18
    environment:
      POSTGRES_USER: mu56_local
      POSTGRES_DB: mu56
      POSTGRES_PASSWORD: ${MU56_LOCAL_DB_PASSWORD:?Run scripts/dev_docker.ps1 Start first}
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mu56_local -d mu56]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    <<: *runtime
    build:
      context: ../..
      dockerfile: deploy/local/backend.Dockerfile
    working_dir: /workspace/backend
    command: [sh, -ec, "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGUSER: mu56_local
      PGDATABASE: mu56
      PGPASSWORD: ${MU56_LOCAL_DB_PASSWORD}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8001,http://127.0.0.1:8001
      TELEGRAM_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../backend:/workspace/backend
      - ../../frontend/src/lib/lead-consent.json:/workspace/frontend/src/lib/lead-consent.json:ro
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  frontend:
    <<: *runtime
    build:
      context: ../..
      dockerfile: deploy/local/frontend.Dockerfile
    working_dir: /workspace/frontend
    command: [sh, -ec, "pnpm install --frozen-lockfile && exec pnpm exec next dev --webpack --hostname 0.0.0.0 --port 3000"]
    environment:
      BACKEND_ORIGIN: http://backend:8000
      SITE_URL: http://127.0.0.1:3000
      SITE_INDEXING_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_DEV_ALLOWED_ORIGINS: localhost,127.0.0.1
    volumes:
      - ../../frontend:/workspace/frontend
      - node_modules:/workspace/frontend/node_modules
      - next_cache:/workspace/frontend/.next
      - ./frontend.env.example:/workspace/frontend/.env.local:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/offerings/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 8
    depends_on:
      backend: {condition: service_healthy}
volumes:
  database:
  node_modules:
  next_cache:
