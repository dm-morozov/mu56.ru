# Enable only after the certificate for both names has been issued.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mu56.ru;
    ssl_certificate /etc/letsencrypt/live/mu56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mu56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://mu56.ru$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mu56.ru;
    ssl_certificate /etc/letsencrypt/live/mu56.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mu56.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    # Reuse the existing safe log format; query strings are not recorded.
    access_log /var/log/nginx/mu56-production-access.log mu56_edge;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host mu56.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
    }
}
