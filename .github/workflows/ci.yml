name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.images.outputs.backend }}
      frontend: ${{ steps.images.outputs.frontend }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mu56_ci
          POSTGRES_USER: mu56_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mu56_ci -d mu56_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: mu56_ci
      PGUSER: mu56_ci
      PGPASSWORD: isolated-ci-only
      DJANGO_DEBUG: '1'
      TELEGRAM_ENABLED: '0'
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      BACKEND_ORIGIN: http://127.0.0.1:8000
      SITE_URL: https://mu56.ru
      SITE_INDEXING_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect image source changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          rebuild=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ]; then
              rebuild=true
            else
              git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > /tmp/mu56-image-paths
              if grep -Eq '^(backend/|frontend/|deploy/(requirements\.txt|gunicorn\.conf\.py|docker/(backend|frontend)\.Dockerfile)|\.github/workflows/ci\.yml)' /tmp/mu56-image-paths; then
                rebuild=true
              fi
            fi
          fi
          printf 'images=%s\n' "$rebuild" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          pnpm --dir frontend install --frozen-lockfile
      - name: Audit release files
        run: |
          python scripts/check_release.py
          python -m unittest discover -s scripts -p test_check_staging.py
          python -m unittest discover -s scripts -p test_release_controller.py
          python -m unittest discover -s scripts -p test_storage_cleanup.py
      - name: Check Django and migrations
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate --noinput
      - name: Test catalog and booking
        run: python backend/manage.py test catalog leads --noinput
      - name: Build frontend against isolated catalog
        shell: bash
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/mu56-ci-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/offerings/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/mu56-ci-backend.log
            exit 1
          fi
          pnpm --dir frontend build
          pnpm --dir frontend typecheck
          node scripts/check_seo.cjs
          node scripts/check_package_details.cjs
          node --experimental-transform-types scripts/check_analytics.mjs
          node --experimental-transform-types scripts/check_selection.mjs
          node --experimental-transform-types scripts/check_booking_draft.mjs
          node --experimental-transform-types scripts/check_booking_quote.mjs
          node --experimental-transform-types scripts/check_booking_addon_transition.mjs
          node --experimental-transform-types scripts/check_catalog_navigation.mjs
      - name: Check isolated browser journeys
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BROWSER_QA_OUTPUT: ${{ runner.temp }}/mu56-browser-qa
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm ci --prefix scripts/browser-qa --no-audit --no-fund
          google-chrome --version
          python backend/manage.py seed_catalog
          python backend/manage.py seed_character_content
          python backend/manage.py seed_offering_content
          python backend/manage.py seed_editorial
          mkdir -p "$BROWSER_QA_OUTPUT"
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > "$BROWSER_QA_OUTPUT/backend.log" 2>&1 &
          backend_pid=$!
          SITE_INDEXING_ENABLED=true pnpm --dir frontend start --port 3100 > "$BROWSER_QA_OUTPUT/frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat "$BROWSER_QA_OUTPUT/backend.log" "$BROWSER_QA_OUTPUT/frontend.log"
            exit 1
          fi
          node --experimental-transform-types scripts/check_booking_catalog.mjs
          python scripts/check_seo_http.py --base http://127.0.0.1:3100 --indexing --report "$BROWSER_QA_OUTPUT/seo-http.json"
          npm --prefix scripts/browser-qa test
          HOMEPAGE_QA_LABEL=after node scripts/browser-qa/home-layout.mjs
          # Reproducible homepage baseline from the PR base, with the same data.
          baseline="$RUNNER_TEMP/mu56-home-baseline"
          git worktree add --detach "$baseline" "$BASE_SHA"
          pnpm --dir "$baseline/frontend" install --frozen-lockfile > "$BROWSER_QA_OUTPUT/baseline-install.log" 2>&1
          pnpm --dir "$baseline/frontend" build > "$BROWSER_QA_OUTPUT/baseline-build.log" 2>&1
          SITE_INDEXING_ENABLED=true pnpm --dir "$baseline/frontend" start --port 3101 > "$BROWSER_QA_OUTPUT/baseline-server.log" 2>&1 &
          baseline_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" "$baseline_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3101/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3101/ > /dev/null
          HOMEPAGE_QA_LABEL=before HOMEPAGE_QA_ORIGIN=http://127.0.0.1:3101 node scripts/browser-qa/home-layout.mjs
      - name: Record public HTTPS diagnostics
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/mu56-browser-qa/public-https"
          mkdir -p "$evidence"
          curl --max-time 20 --connect-timeout 10 --silent --show-error \
            --user-agent 'TelegramBot (like TwitterBot)' \
            --dump-header "$evidence/headers.txt" --output "$evidence/home.html" \
            --write-out 'http=%{http_code}\nremote_ip=%{remote_ip}\nssl_verify=%{ssl_verify_result}\nttfb=%{time_starttransfer}\ntotal=%{time_total}\n' \
            https://mu56.ru/ > "$evidence/timing.txt" 2> "$evidence/curl-errors.txt" || true
          tls_status=0
          timeout 20 openssl s_client -connect mu56.ru:443 -servername mu56.ru \
            -verify_return_error -verify_hostname mu56.ru -showcerts < /dev/null > "$evidence/tls.txt" 2>&1 || tls_status=$?
          printf 'openssl_exit=%s\n' "$tls_status" >> "$evidence/tls.txt"
          openssl x509 -in "$evidence/tls.txt" -noout -subject -issuer -dates \
            -ext subjectAltName > "$evidence/certificate.txt" 2>&1 || true
          for path in / /media/social-preview-20261008-v5.jpg; do
            curl --max-time 20 --connect-timeout 10 --silent --show-error --output /dev/null \
              --write-out 'url=%{url_effective} http=%{http_code} type=%{content_type} bytes=%{size_download} ssl_verify=%{ssl_verify_result} ttfb=%{time_starttransfer}\n' \
              "https://mu56.ru$path" >> "$evidence/normal-get.txt" 2>&1 || true
          done
          if [ -f "$evidence/home.html" ]; then
            grep -bo 'property="og:[^"]*"' "$evidence/home.html" > "$evidence/og-byte-offsets.txt" || true
          fi
      - name: Save browser QA evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-qa-${{ github.sha }}
          path: ${{ runner.temp }}/mu56-browser-qa/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
      - name: Build and publish pinned Docker images
        id: images
        if: github.event_name == 'push' && github.ref == 'refs/heads/local/release-20261006' && steps.changes.outputs.images == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io; if [ -n "${backend_pid:-}" ]; then kill "$backend_pid" 2>/dev/null || true; fi' EXIT
          python backend/manage.py runserver 127.0.0.1:8081 --noreload > /tmp/mu56-image-api.log 2>&1 &
          backend_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/api/v1/offerings/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8081/api/v1/offerings/ > /dev/null
          for service in backend frontend; do
            image="ghcr.io/dm-morozov/mu56-${service}"
            docker build --network host -f "deploy/docker/${service}.Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/dm-morozov/mu56.ru" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image:$GITHUB_SHA" .
            docker push "$image:$GITHUB_SHA"
            digest=$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
            printf '%s=%s\n' "$service" "$digest" >> "$GITHUB_OUTPUT"
          done
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/local/release-20261006' && needs.application.outputs.backend != ''
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: mu56-dev
    permissions:
      contents: read
      packages: read
    concurrency:
      group: mu56-vps-release
      cancel-in-progress: false
    steps:
      - name: Deploy exact checked images
        env:
          DEPLOY_KEY: ${{ secrets.MU56_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.MU56_HOST_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ needs.application.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.application.outputs.frontend }}
        shell: bash
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/mu56"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/mu56" "$HOME/.ssh/known_hosts"' EXIT
          python -c 'import json,os; print(json.dumps({"sha":os.environ["GITHUB_SHA"], "backend":os.environ["BACKEND_IMAGE"], "frontend":os.environ["FRONTEND_IMAGE"], "token":os.environ["REGISTRY_TOKEN"]}))' | \
            ssh -i "$HOME/.ssh/mu56" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes mu56-deploy@161.104.32.37 release
